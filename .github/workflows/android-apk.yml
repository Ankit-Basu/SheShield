name: Android APK

# Builds an installable SheShield Android APK from mobile/ on GitHub's servers and
# publishes it as a GitHub Release, so it can be downloaded straight onto a phone.
# Runs when the app changes on master, on a mobile-v* tag, or from the Actions tab.

on:
  push:
    branches: [master]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
    tags: ['mobile-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://sheshield-y9jp.onrender.com/
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # Release build for 64-bit ARM, which every Android phone from the last
      # several years uses. It is signed with the debug key Expo generates, which
      # is fine for installing directly; the Play Store would need EAS signing.
      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      # Build numbers continue from the old SheShield_app repository (builds 1-6).
      - name: Name the APK
        id: apk
        run: |
          version=$(node -p "require('./app.json').expo.version")
          build=$((GITHUB_RUN_NUMBER + 6))
          name="SheShield-${version}-build${build}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=mobile-v${version}-build${build}" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: mobile/${{ steps.apk.outputs.name }}

      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.apk.outputs.tag }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          gh release create "$tag" "${{ steps.apk.outputs.name }}" \
            --title "SheShield app ${tag#mobile-}" \
            --notes "Android APK for the SheShield app. On your phone, tap the .apk file below to download it, then open it to install. Connects to https://sheshield-y9jp.onrender.com." \
            --target "${GITHUB_SHA}" --latest
