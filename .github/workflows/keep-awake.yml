name: Keep Render awake

# Render's free plan sleeps after 15 minutes without requests; the next visitor (or
# the mobile app) then waits up to a minute. The stats endpoint also queries MySQL,
# so pinging it keeps the Aiven database active too.
#
# GitHub throttles scheduled workflows on quiet repositories (a "*/10" schedule ran
# only every few hours), so each run stays alive and pings every 10 minutes for
# 5 h 40 min. Runs queue one behind another rather than cancelling, so coverage is
# continuous even when GitHub starts them late. Free for public repositories.
#
# One always-on free service uses about 744 of Render's 750 free hours a month.
# GitHub pauses schedules in repos with no commits for 60 days; re-enable them from
# the Actions tab if that happens.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      APP_URL: ${{ vars.RENDER_URL || 'https://sheshield-y9jp.onrender.com' }}
      ROUNDS: 34
    steps:
      - name: Ping every 10 minutes
        run: |
          ok=0
          for i in $(seq 1 "$ROUNDS"); do
            code=$(curl -s -o response.txt -w '%{http_code}' --max-time 120 \
                   --retry 3 --retry-delay 10 --retry-all-errors \
                   "$APP_URL/api/public_stats.php" || true)
            echo "$(date -u +%H:%M) round $i: HTTP $code $(head -c 120 response.txt 2>/dev/null)"
            [ "$code" = 200 ] && ok=$((ok + 1))
            [ "$i" -lt "$ROUNDS" ] && sleep 600
          done
          echo "$ok of $ROUNDS pings answered"
          test "$ok" -gt 0
