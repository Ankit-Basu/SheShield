# ─────────────────────────────────────────────────
# SheShield — Ansible Inventory
# Update the IP with your EC2 public IP from Terraform output
# Usage: ansible-playbook -i inventory.ini playbook.yml
# ─────────────────────────────────────────────────

[webservers]
# Replace with your EC2 public IP (from: terraform output app_server_public_ip)
sheshield-app ansible_host=YOUR_EC2_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/sheshield-key.pem

[webservers:vars]
ansible_python_interpreter=/usr/bin/python3

[all:vars]
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
