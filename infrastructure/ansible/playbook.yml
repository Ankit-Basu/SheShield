# ─────────────────────────────────────────────────
# SheShield — Ansible Playbook
# Configures the EC2 server with PHP, Apache, Docker,
# and deploys the SheShield application
# Usage: ansible-playbook -i inventory.ini playbook.yml
# ─────────────────────────────────────────────────
---
- name: Configure SheShield Web Server
  hosts: webservers
  become: yes
  vars:
    app_dir: /var/www/html/sheshield
    db_host: "{{ lookup('env', 'DB_HOST') | default('localhost', true) }}"
    db_name: sheshield
    db_user: root
    db_pass: "{{ lookup('env', 'DB_PASS') | default('sheshield_secret', true) }}"
    server_name: "{{ lookup('env', 'SERVER_NAME') | default('localhost', true) }}"

  tasks:
    # ─── System Updates ─────────────────────────────
    - name: Update system packages
      apt:
        update_cache: yes
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: Update system packages (Amazon Linux)
      yum:
        name: '*'
        state: latest
      when: ansible_os_family == "RedHat"

    # ─── Install Docker ─────────────────────────────
    - name: Install Docker (Debian/Ubuntu)
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Docker (Amazon Linux)
      yum:
        name:
          - docker
        state: present
      when: ansible_os_family == "RedHat"

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    # ─── Install PHP & Apache (Debian/Ubuntu) ───────
    - name: Install Apache, PHP 8.2 and extensions
      apt:
        name:
          - apache2
          - php8.2
          - php8.2-mysql
          - php8.2-mbstring
          - php8.2-curl
          - php8.2-gd
          - php8.2-zip
          - php8.2-xml
          - libapache2-mod-php8.2
          - composer
          - git
          - curl
          - unzip
        state: present
      when: ansible_os_family == "Debian"

    # ─── Enable Apache Modules ──────────────────────
    - name: Enable Apache rewrite module
      apache2_module:
        name: rewrite
        state: present
      notify: Restart Apache
      when: ansible_os_family == "Debian"

    - name: Enable Apache headers module
      apache2_module:
        name: headers
        state: present
      notify: Restart Apache
      when: ansible_os_family == "Debian"

    # ─── Deploy Application ─────────────────────────
    - name: Clone SheShield repository
      git:
        repo: 'https://github.com/Ankit-Basu/SheShield.git'
        dest: "{{ app_dir }}"
        version: master
        force: yes

    - name: Install Composer dependencies
      composer:
        command: install
        working_dir: "{{ app_dir }}"
        no_dev: yes
        optimize_autoloader: yes
      ignore_errors: yes

    # ─── Create Required Directories ────────────────
    - name: Create upload directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0777'
        owner: www-data
        group: www-data
      loop:
        - "{{ app_dir }}/uploads"
        - "{{ app_dir }}/uploads/evidence"
        - "{{ app_dir }}/uploads/profile_images"
        - "{{ app_dir }}/logs"
      when: ansible_os_family == "Debian"

    # ─── Set Permissions ────────────────────────────
    - name: Set proper file ownership
      file:
        path: "{{ app_dir }}"
        owner: www-data
        group: www-data
        recurse: yes
      when: ansible_os_family == "Debian"

    - name: Set directory permissions
      file:
        path: "{{ app_dir }}"
        mode: '0755'
        recurse: yes

    # ─── Configure Apache VirtualHost ───────────────
    - name: Deploy Apache virtual host config
      template:
        src: templates/sheshield-vhost.conf.j2
        dest: /etc/apache2/sites-available/sheshield.conf
      notify: Restart Apache
      when: ansible_os_family == "Debian"

    - name: Enable SheShield site
      command: a2ensite sheshield.conf
      notify: Restart Apache
      when: ansible_os_family == "Debian"

    - name: Disable default site
      command: a2dissite 000-default.conf
      notify: Restart Apache
      when: ansible_os_family == "Debian"

    # ─── Start Monitoring Stack ─────────────────────
    - name: Start monitoring stack with Docker Compose
      command: docker compose -f infrastructure/docker-compose.yml up -d
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes

    # ─── Firewall Configuration ─────────────────────
    - name: Allow HTTP through firewall
      ufw:
        rule: allow
        port: '80'
        proto: tcp
      when: ansible_os_family == "Debian"

    - name: Allow HTTPS through firewall
      ufw:
        rule: allow
        port: '443'
        proto: tcp
      when: ansible_os_family == "Debian"

    # ─── Initialize Database ────────────────────────
    - name: Run database initialization
      command: php init.php
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes

    # ─── Health Check ───────────────────────────────
    - name: Verify Apache is serving
      uri:
        url: "http://localhost"
        status_code: [200, 301, 302]
      register: result
      ignore_errors: yes

    - name: Display deployment status
      debug:
        msg: "SheShield deployment {{ 'SUCCESSFUL' if result.status is defined else 'NEEDS VERIFICATION' }}"

  # ─── Handlers ───────────────────────────────────
  handlers:
    - name: Restart Apache
      service:
        name: apache2
        state: restarted
        enabled: yes
