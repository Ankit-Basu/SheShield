# SheShield - Docker Compose
# Local development environment with PHP + MySQL.
# Run from the repository root:
#   docker compose -f infrastructure/docker/docker-compose.yml up -d --build

services:
  # PHP/Apache Application
  app:
    build:
      # The image needs the whole repository, not just this folder.
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: sheshield-app
    ports:
      # Override with APP_PORT if 8080 is taken, e.g. APP_PORT=8095
      - "${APP_PORT:-8080}:80"
    environment:
      - DB_HOST=db
      - DB_NAME=sheshield
      - DB_USER=root
      - DB_PASS=sheshield_secret
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../uploads:/var/www/html/uploads
      - ../../logs:/var/www/html/logs
    networks:
      - sheshield-network
    restart: unless-stopped

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: sheshield-db
    environment:
      MYSQL_ROOT_PASSWORD: sheshield_secret
      MYSQL_DATABASE: sheshield
    ports:
      - "3307:3306"
    volumes:
      # No init script: the app creates and upgrades its own tables on the first request.
      - db_data:/var/lib/mysql
    networks:
      - sheshield-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # phpMyAdmin (for development)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sheshield-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: sheshield_secret
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - sheshield-network
    restart: unless-stopped

volumes:
  db_data:
    driver: local

networks:
  sheshield-network:
    driver: bridge
