global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Prometheus scrapes its own metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus-server'

  # Loki metrics (log aggregation engine)
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          instance: 'loki-server'

  # Promtail metrics (log shipper)
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
        labels:
          instance: 'promtail-agent'

  # Docker Desktop metrics (OPTIONAL — requires Docker Desktop restart)
  # To enable: Docker Desktop → Settings → Docker Engine → add:
  #   "metrics-addr": "0.0.0.0:9323"
  # Then RESTART Docker Desktop completely
  # Uncomment below after restart:
  # - job_name: 'docker'
  #   static_configs:
  #     - targets: ['host.docker.internal:9323']
  #       labels:
  #         instance: 'docker-engine'
