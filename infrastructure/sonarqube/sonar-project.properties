# SonarQube Configuration for SheShield
sonar.projectKey=sheshield
sonar.projectName=SheShield - Women Safety Application
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=.

# Exclusions (non-source directories)
sonar.exclusions=vendor/**,node_modules/**,uploads/**,logs/**,screenshots/**,images/**,devops/**,k8s/**,terraform/**

# Language
sonar.language=php

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage reports (if applicable)
# sonar.php.coverage.reportPaths=coverage.xml
